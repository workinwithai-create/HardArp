<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HardArp — Four-bar hardwave arpeggio desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tap-overlay" class="overlay">Tap to start audio</div>
  <header>
    <h1>HardArp</h1>
    <p>Four-bar live hardwave arpeggio desk. Locks your chords to the grid. FluidR3 marimba, kit, piano.</p>
  </header>
  <main>
    <section id="controls">
      <label>BPM <input type="number" id="bpm" min="60" max="180" value="92"></label>
      <label>Key <select id="key">
        <option value="Am">A minor</option>
        <option value="C">C major</option>
        <option value="G">G major</option>
        <option value="Em">E minor</option>
      </select></label>
      <label>Chords (4) <input type="text" id="chords" value="Am F C G" placeholder="Am F C G"></label>
      <button id="play">Play</button>
      <button id="stop">Stop</button>
      <div id="recipes">
        <button data-recipe="root-fifth">Root-Fifth</button>
        <button data-recipe="chromatic">Chromatic Walk</button>
        <button data-recipe="octave">Octave Push</button>
      </div>
      <div id="status">Loading samples...</div>
    </section>
    <section id="playhead">
      <div id="bars"></div>
    </section>
    <section id="exports">
      <button id="export-wav">Export WAV (loop)</button>
      <button id="export-wav-tail">Export WAV (with tail)</button>
      <button id="export-midi">Export MIDI</button>
    </section>
  </main>
  <footer>
    <p>Samples pinned to gleitz/midi-js-soundfonts@044fab8. Distinct from TagFour, LiftTwo, ArpFour, GrooveFour. Free desk.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
